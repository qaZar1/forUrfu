
    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Регистрация</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="d-flex align-items-center justify-content-center vh-100">
        <div class="card p-4 shadow" style="width: 400px;">
            <h2 class="text-center">Регистрация работодателя</h2>
            <form id="registerForm">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Имя" id="name">
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Никнейм" id="username">
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Пароль" id="password">
                </div>
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Компания" id="company">
                </div>
                <button type="submit" class="btn btn-primary w-100">Зарегистрироваться</button>
            </form>
            <div id="message-box" class="alert d-none mt-3"></div>
        </div>

        <script src="static/js/register_employer.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
