<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вакансии</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/home">forUrfu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/employers/vacancies">Мои вакансии</a></li>
                    <li class="nav-item"><a class="nav-link" href="/employers/responses">Отклики</a></li>
                    <li class="nav-item"><a class="nav-link" href="/employers/profile">Профиль</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <button class="btn btn-success mb-3" onclick="window.location.href='/employers/addVacancy'">Добавить новую вакансию</button>
        <div class="row">
            {{ if .Vacancies }}
                <h2 class="mb-4">Мои вакансии</h2>
                {{ range .Vacancies }}
                    <div class="col-md-6 mb-3">
                        <div class="card p-3">
                            <h4>Вакансия: {{ .Title }}</h4>
                            <p><strong>Описание:</strong> {{ .Description }}</p>
                            <div class="mt-2">
                                {{ range .Tags }}
                                    <span class="badge bg-primary">{{ . }}</span>
                                {{ end }}
                            </div>
                            <a href="/employers/vacancy/id-{{ .ID }}" class="btn btn-primary mt-3">Подробнее</a>
                        </div>
                    </div>
                {{ end }}
            {{ else }}
                <h2>Нет доступных вакансий</h2>
            {{ end }}
        </div>
    </div>
    
    <script type="module">
        import { checkToken } from '/static/js/authEmployers.js';
        document.addEventListener('DOMContentLoaded', () => {
            checkToken();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
