
    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Отклики</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container">
                <a class="navbar-brand" href="/home">forUrfu</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/employers/vacancies">Мои вакансии</a></li>
                        <li class="nav-item"><a class="nav-link" href="/employers/responses">Отклики</a></li>
                        <li class="nav-item"><a class="nav-link" href="/employers/profile">Профиль</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <h2>Отклики на ваши вакансии</h2>
            <div class="row">
                {{ if .Responses }}
                    {{ range .Responses }}
                        <div class="col-md-6 mb-3">
                            <div class="card p-3">
                                <h4>Отклик на вакансию: {{ .Title }}</h4>
                                <p><strong>Компания:</strong> {{ .Company }}</p>
                                <p><strong>Статус отклика:</strong> {{ .Status }}</p>
                                <a href="/employers/response/id-{{ .RespID }}" class="btn btn-primary">Открыть отклик</a>
                            </div>
                        </div>
                    {{ end }}
                {{ else }}
                    <h2>Нет доступных откликов</h2>
                {{ end }}
            </div>
        </div>

        <script type="module">
            import { checkToken } from '/static/js/authEmployers.js';
            document.addEventListener('DOMContentLoaded', () => {
                checkToken();
            });
        </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
