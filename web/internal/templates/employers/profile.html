<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Профиль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/home">forUrfu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/employers/vacancies">Мои вакансии</a></li>
                    <li class="nav-item"><a class="nav-link" href="/employers/responses">Отклики</a></li>
                    <li class="nav-item"><a class="nav-link" href="/employers/profile">Профиль</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2>Профиль пользователя</h2>
        <div class="card p-4">
            <p><strong>Имя:</strong> {{ .Employer.FirstName }}</p>
            <p><strong>Username:</strong> {{ .Employer.Username }}</p>
            <p><strong>Компания:</strong> {{ .Employer.Company }}</p>
            <div>
                {{ if lt .Rating.Rating 0.1 }}
                    <p class="text-muted">Пока никто не оценил компанию</p>
                {{ else }}
                    <div class="rating mt-2" data-rating="{{ .Rating.Rating }}">
                        <span class="star" data-value="1">★</span>
                        <span class="star" data-value="2">★</span>
                        <span class="star" data-value="3">★</span>
                        <span class="star" data-value="4">★</span>
                        <span class="star" data-value="5">★</span>
                    </div>
                    <p>( {{ .Rating.Rating }} )</p>
                {{ end }}
            </div>
            <button class="btn btn-danger" onclick="logout()">Выйти из аккаунта</button>
        </div>
    </div>

    <style>
        .rating {
            font-size: 1.2rem;
            color: #ccc;
            position: relative;
        }
        .star {
            cursor: pointer;
            color: #ddd;
            position: relative;
        }
        .star.filled {
            color: gold;
        }
        .star.half::before {
            content: '★';
            position: absolute;
            left: 0;
            width: 50%;
            overflow: hidden;
            color: gold;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            document.querySelectorAll(".rating").forEach(ratingEl => {
                let rating = parseFloat(ratingEl.dataset.rating);
                let stars = ratingEl.querySelectorAll(".star");

                stars.forEach(star => {
                    let value = parseInt(star.dataset.value); // Целочисленное значение звезды
                    star.classList.remove("filled", "half");

                    if (value <= Math.floor(rating)) {
                        star.classList.add("filled"); // Полная звезда
                    } else if (value === Math.ceil(rating) && rating % 1 >= 0.5) {
                        star.classList.add("half"); // Половинка звезды (например, 3.5, 4.5)
                    }
                });
            });
        });
    </script>
    <script>
        function logout() {
            document.cookie = "token_employers=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;";
            window.location.href = '/loginEmployers';
        }
    </script>
    <script type="module">
        import { checkToken } from '/static/js/authEmployers.js';
        document.addEventListener('DOMContentLoaded', () => {
            checkToken();
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
