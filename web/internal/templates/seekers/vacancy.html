<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вакансия</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/home">forUrfu</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/vacancies">Вакансии</a></li>
                    <li class="nav-item"><a class="nav-link" href="/responses">Мои отклики</a></li>
                    <li class="nav-item"><a class="nav-link" href="/profile">Профиль</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card p-4">
            <h2>Вакансия: {{ .Vacancy.Title }}</h2>
            <p><strong>Компания:</strong> {{ .Vacancy.Company }}</p>
            <p><strong>Описание:</strong> {{ .Vacancy.Description }}</p>
            <div class="mt-3">
                {{ range .Vacancy.Tags }}
                    <span class="badge bg-primary">{{ . }}</span>
                {{ end }}
            </div>
            {{ if .Applied }}
                <p class="text-muted mt-3">Вы уже откликнулись на эту вакансию</p>
            {{ else }}
                <button class="btn btn-success mt-3" id="accept">Откликнуться</button>
            {{ end }}
        </div>
    </div>

    <script type="module">
        import { checkToken } from '/static/js/auth.js';
        document.addEventListener('DOMContentLoaded', () => {
            checkToken();
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
        // Функция для получения значения из cookie
        function getCookie(name) {
            let match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
            if (match) return match[2];
            return null;
        }

        // Получаем username из cookie
        const username = getCookie('username');

        // Получаем vacancyID и employerID, которые подаются в HTML через chi
        const vacancyID = "{{ .Vacancy.ID }}";  // Chi-шаблон подает данные
        const employerID = "{{ .Vacancy.EmployerID }}";

            document.getElementById('accept').addEventListener('click', async function(event) {
                event.preventDefault();

                const formData = new FormData();
                formData.append('username', username);    // Добавляем username
                formData.append('vacancyID', vacancyID);  // Добавляем vacancyID
                formData.append('employerID', employerID); 

                

                try {
                    // Отправляем данные на сервер через Fetch API
                    const response = await fetch('/acceptVacancy', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        // Перенаправляем на домашнюю страницу
                        window.location.href = '/vacancies';
                    } else {
                        // Если произошла ошибка, показываем сообщение
                        document.getElementById('error-message').style.display = 'block';
                    }
                } catch (error) {
                    console.error('Ошибка отправки данных:', error);
                    document.getElementById('error-message').style.display = 'block';
                }
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
