
    <!DOCTYPE html>
    <html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Вход</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="d-flex align-items-center justify-content-center vh-100">
        <div class="card p-4 shadow" style="width: 400px;">
            <h2 class="text-center">Вход</h2>
            <form id="loginForm">
                <div class="mb-3">
                    <input type="text" class="form-control" placeholder="Никнейм" id="username" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" placeholder="Пароль" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Вход</button>
                <button type="button" class="btn btn-secondary w-100 mt-2" onclick="window.location.href='/register'">Регистрация</button>
            </form>
            <button class="btn btn-outline-dark mt-3 w-100" onclick="window.location.href='/loginEmployers'">Вход для работодателя</button>
        </div>
        <script src="/static/js/login.js" type="module"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
